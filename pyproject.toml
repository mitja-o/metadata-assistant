[project]
name = "massi"
version = "0.1.0"
description = "(M)IAGIS (Assi)stant is an LLM-Agent helper for generating MIAGIS description of Geo(-scripting) projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grandalf>=0.8",
    "ipython>=8.38.0",
    "ipywidgets>=8.1.8",
    "jsonschema>=4.25.1",
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.9",
    "langgraph>=1.0.5",
    "pandas>=3.0.0",
    "python-dotenv>=1.2.1",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
    "langgraph-cli[inmem]>=0.4.11",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
]
experiments = [
    "pypdf>=6.8.0",
]
observability = ["lmnr[all]>=0.7.40"]
sandbox = ["duckdb>=1.4.4"]

[tool.pytest]
minversion = "9.0"
addopts = ["--doctest-modules"]
testpaths = ["massi"]

[tool.isort]
profile = "black"
