    - id: UC2
      tag: used-product-inference
      description: |
        massi can study the documents in the working directory (including the Jupyter notebooks)
        to identify the 'products' involved in the GIS application
      expected-outcome: a completed CSV product attributes file (MIAGIS requirement)
      sub-tasks: 
        - description: |
            Scan working directory to inventory all local files (GeoJSON, SHP, TIF) and assign the GIS relevancy scores.
          status: *finished
        - description: |
            Organize the extracted GIS resource files into Resource Description entries:
            1. For files with embedded metadata, retrieve the metadata to enrich the context.
            2. Group files that conform to the same 'resource'.
            3. Given the basic file details (name, author, etc), fill in the resource description file.
          notes: |
            - Use a map-reduce approach?
            - Group resources by name and translate them into Resource Description entries per group.
            - Rely on an in-memory database for 'concurrent' resource description generation?
            - Eventually dump/expose the database?
          status: *finished
