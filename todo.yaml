        #     1. Ingest information from the data and related artifacts, e.g.
        #         1. parse Jupyter Notebook cells for remote service URLs (REST endpoints) and other snippets
        #         2. read textual files that describe the process
        #         3. retrieve metadata from metadata-infused artifacts
        #         4. perform basic data exploration and identify the higher-level patterns/features
        #     2. Come up with the relevant fields for the metadata
        #     3. Enrich the resource records with metadata
        #   status: *planned
        # - description: |
        #     Validate the produced descriptions for semantic soundness:

        #     1. Validate 'creator' and 'creator_type' alignment, ensuring 1:1 mapping for multi-entry comma-separated strings as per MIAGIS logic.
        #     2. Validate sound collection of resource descriptions
        #     3. (TBD...)
        #   status: *planned
        # - description: |
        #     Suggest the user to review the produced resource description table (e.g. using DuckDB).
        #   status: *planned
        # - description: |
        #     Once user confirms readiness, remove all 'operational' columns and tags, and finalize the resource description.
        #   status: *planned
      validation: |#md
        1. Verify `resource_name` column exists.
        2. Ensure `alternate_locations` contains valid URLs/paths.
        3. Check that `creator` and `creator_type` counts match in each row.

        see
