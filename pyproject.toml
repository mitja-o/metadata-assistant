[project]
name = "massi"
version = "0.1.0"
description = "(M)IAGIS (Assi)stant is an LLM-Agent helper for generating MIAGIS description of Geo(-scripting) projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython>=8.38.0",
    "jsonschema>=4.25.1",
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.5",
]

[dependency-groups]
dev = ["langgraph-cli[inmem]>=0.4.11", "pytest>=9.0.2"]

[tool.pytest]
minversion = "9.0"
addopts = ["--doctest-modules"]
